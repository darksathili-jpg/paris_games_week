<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050b19"/><stop offset=".55" stop-color="#101a38"/><stop offset="1" stop-color="#08040f"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#11192f"/><stop offset="1" stop-color="#02050d"/></linearGradient>
  <radialGradient id="glow1"><stop stop-color="#ff9a61" stop-opacity=".52"/><stop offset="1" stop-color="#ff9a61" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow2"><stop stop-color="#57efff" stop-opacity=".44"/><stop offset="1" stop-color="#57efff" stop-opacity="0"/></radialGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff9a61" stop-opacity=".7"/><stop offset="1" stop-color="#ff9a61" stop-opacity="0"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".55"/></filter>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<circle cx="330" cy="260" r="360" fill="url(#glow1)" filter="url(#blur)"/>
<circle cx="1320" cy="220" r="340" fill="url(#glow2)" filter="url(#blur)"/>
<!-- ceiling truss -->
<g stroke="#7d90b4" stroke-opacity=".18" fill="none">
 <path d="M0 105H1600M0 175H1600M80 0L430 220M1520 0L1170 220"/>
 <path d="M210 60H1390" stroke-width="7"/><path d="M280 60L360 170M500 60L580 170M720 60L800 170M940 60L1020 170M1160 60L1240 170"/>
</g>
<!-- lights -->
<g>
 <circle cx="240" cy="118" r="11" fill="#ff9a61"/><circle cx="520" cy="102" r="9" fill="#fff"/><circle cx="820" cy="112" r="10" fill="#57efff"/><circle cx="1180" cy="102" r="9" fill="#fff"/><circle cx="1380" cy="126" r="11" fill="#ff9a61"/>
 <path d="M240 130L110 700H370Z" fill="url(#beam)" opacity=".28"/><path d="M820 122L690 720H950Z" fill="url(#beam)" opacity=".18"/><path d="M1380 138L1240 730H1530Z" fill="url(#beam)" opacity=".22"/>
</g>
<!-- expo side structures -->
<g opacity=".9">
 <rect x="36" y="300" width="260" height="390" rx="20" fill="#0d1830" stroke="#ff9a61" stroke-opacity=".42"/>
 <rect x="1304" y="300" width="260" height="390" rx="20" fill="#0d1830" stroke="#57efff" stroke-opacity=".42"/>
 <rect x="68" y="342" width="196" height="116" rx="14" fill="#ff9a61" fill-opacity=".12"/>
 <rect x="1336" y="342" width="196" height="116" rx="14" fill="#57efff" fill-opacity=".12"/>
</g>
<!-- floor -->
<path d="M0 650H1600V1000H0Z" fill="url(#floor)"/>
<g stroke="#8aa6d6" stroke-opacity=".09">
 <path d="M800 650L560 1000M800 650L1040 1000M800 650L300 1000M800 650L1300 1000"/>
 <path d="M0 760H1600M0 875H1600"/>
</g>

<!-- dev station -->
<g filter="url(#shadow)">
 <rect x="520" y="250" width="400" height="270" rx="24" fill="#091326" stroke="#ff9a61" stroke-opacity=".45"/>
 <rect x="550" y="280" width="340" height="210" rx="14" fill="#06101f"/>
 <g opacity=".85"><rect x="580" y="312" width="150" height="8" rx="4" fill="#ff9a61" fill-opacity=".65"/><rect x="635" y="331" width="128" height="8" rx="4" fill="#57efff" fill-opacity=".65"/><rect x="580" y="350" width="106" height="8" rx="4" fill="#ff9a61" fill-opacity=".65"/><rect x="635" y="369" width="150" height="8" rx="4" fill="#57efff" fill-opacity=".65"/><rect x="580" y="388" width="128" height="8" rx="4" fill="#ff9a61" fill-opacity=".65"/><rect x="635" y="407" width="106" height="8" rx="4" fill="#57efff" fill-opacity=".65"/><rect x="580" y="426" width="150" height="8" rx="4" fill="#ff9a61" fill-opacity=".65"/><rect x="635" y="445" width="128" height="8" rx="4" fill="#57efff" fill-opacity=".65"/></g>
 <rect x="960" y="270" width="360" height="250" rx="24" fill="#091326" stroke="#57efff" stroke-opacity=".45"/>
 <rect x="990" y="300" width="300" height="190" rx="14" fill="#0c1830"/>
 <circle cx="1140" cy="395" r="72" fill="#57efff" fill-opacity=".1"/><path d="M1085 400L1130 355L1180 390L1230 345" fill="none" stroke="#57efff" stroke-width="12" stroke-linecap="round"/>
</g>
<!-- seated developer -->
<g transform="translate(690 560)">
 <circle cx="0" cy="0" r="58" fill="#19141e"/>
 <path d="M-105 88Q0 15 105 88L130 310H-130Z" fill="#111725"/>
 <path d="M-60 55Q0 20 60 55" stroke="#ff9a61" stroke-width="14" fill="none" stroke-linecap="round"/>
 <path d="M70 180L230 95" stroke="#d8b09a" stroke-width="30" stroke-linecap="round"/>
</g>
<!-- desk -->
<path d="M410 760H1350L1270 900H480Z" fill="#0a1324" stroke="#ff9a61" stroke-opacity=".25"/>

<!-- generic crowd silhouettes -->
<g fill="#050913" opacity=".88">
 <g transform="translate(90 690)"><circle cx="0" cy="0" r="26"/><path d="M-38 34Q0 10 38 34L54 170H-54Z"/></g><g transform="translate(170 708)"><circle cx="0" cy="0" r="26"/><path d="M-38 34Q0 10 38 34L54 170H-54Z"/></g><g transform="translate(255 690)"><circle cx="0" cy="0" r="26"/><path d="M-38 34Q0 10 38 34L54 170H-54Z"/></g><g transform="translate(345 708)"><circle cx="0" cy="0" r="26"/><path d="M-38 34Q0 10 38 34L54 170H-54Z"/></g><g transform="translate(1250 690)"><circle cx="0" cy="0" r="26"/><path d="M-38 34Q0 10 38 34L54 170H-54Z"/></g><g transform="translate(1335 708)"><circle cx="0" cy="0" r="26"/><path d="M-38 34Q0 10 38 34L54 170H-54Z"/></g><g transform="translate(1420 690)"><circle cx="0" cy="0" r="26"/><path d="M-38 34Q0 10 38 34L54 170H-54Z"/></g><g transform="translate(1510 708)"><circle cx="0" cy="0" r="26"/><path d="M-38 34Q0 10 38 34L54 170H-54Z"/></g>
</g>
<!-- reflected accents -->
<g opacity=".18" filter="url(#soft)">
 <ellipse cx="420" cy="900" rx="300" ry="42" fill="#ff9a61"/><ellipse cx="1160" cy="920" rx="260" ry="38" fill="#57efff"/>
</g>
</svg>