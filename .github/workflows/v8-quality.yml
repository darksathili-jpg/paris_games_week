name: V8 Quality Gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'preview-v8.html'
      - 'css/v8-*.css'
      - 'js/v8-*.js'
      - 'tools/**'
      - 'assets/v8/**'
      - 'ART_DIRECTION_V8.md'
      - 'IMAGE_PIPELINE_V8.md'
      - 'package.json'
      - '.github/workflows/v8-quality.yml'
  pull_request:
    paths:
      - 'preview-v8.html'
      - 'css/v8-*.css'
      - 'js/v8-*.js'
      - 'tools/**'
      - 'assets/v8/**'
      - 'package.json'

permissions:
  contents: read

jobs:
  v8-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install image tooling
        run: npm install --no-package-lock --ignore-scripts=false

      - name: Check JavaScript syntax
        run: |
          node --check js/v8-data.js
          node --check js/v8-app.js
          node --check js/v8-quality.js
          node --check js/v8-sync.js
          node --check js/v8-supabase.js
          node --check js/v8-supabase-config.js
          node --check js/v8-join.js
          node --check js/teacher.js
          node --check tools/validate-images.mjs
          node --check tools/build-images.mjs
          node --check tools/check-mission-state.mjs

      - name: Enforce mission production states
        run: node tools/check-mission-state.mjs

      - name: Validate image masters when pilot exists
        shell: bash
        run: |
          if [ -f assets/v8/masters/mission-01.png ]; then
            npm run images:validate
          else
            echo "Mission 01 master not present yet: image validation deferred."
          fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build image derivatives when pilot exists
        shell: bash
        run: |
          if [ -f assets/v8/masters/mission-01.png ]; then
            npm run images:build
          else
            echo "Mission 01 master not present yet: image build deferred."
          fi

      - name: Visual smoke tests
        run: npx playwright test --grep "images approuvees chargees sans erreur|progression séquentielle|parcours terrain complet|verrouillage impossible|contenu pedagogique complet|drawer lisible|autosauvegarde|backup local|mission deja validee|queue idempotente|coupure réseau|LIVE join anonyme|LIVE progression M01"
